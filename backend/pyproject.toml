[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memora-backend"
version = "0.1.0"
description = "Memora API service"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.16.1",
    "asyncpg==0.30.0",
    "fastapi==0.115.12",
    "pydantic==2.11.5",
    "pydantic-settings==2.9.1",
    "SQLAlchemy==2.0.41",
    "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "ruff==0.11.13",
]

[tool.setuptools]
packages = ["app", "app.api", "app.middleware"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
