services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: memora
      POSTGRES_USER: memora
      POSTGRES_PASSWORD: memora
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memora -d memora"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  test-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: memora_test
      POSTGRES_USER: memora
      POSTGRES_PASSWORD: memora
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memora -d memora_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      MEMORA_DATABASE_URL: postgresql+asyncpg://memora:memora@db:5432/memora
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
